name: MacSpoofer CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dev deps
        run: pip install -e ".[dev]"

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Running setup script
        run: |
          sudo chmod +x setup.sh
          sudo ./setup.sh

      - name: Create dummy interface (wlan0)
        run: |
          sudo ip link add wlan0 type dummy
          sudo ip link set wlan0 up
          echo "Created dummy interface:"
          ip link show wlan0

      - name: Get initial MAC
        id: get_mac
        run: |
          OLD_MAC=$(ip link show wlan0 | awk '/ether/ {print $2}')
          echo "old_mac=$OLD_MAC" >> $GITHUB_OUTPUT

      - name: Run MacSpoofer in CI mode
        run: |
          echo "Spoofing MAC on dummy wlan0..."
          sudo python3 ./main.py -i wlan0 --ci

      - name: Verify MAC change
        run: |
          OLD_MAC="${{ steps.get_mac.outputs.old_mac }}"
          NEW_MAC=$(ip link show wlan0 | awk '/ether/ {print $2}')
          echo "Old MAC: $OLD_MAC"
          echo "New MAC: $NEW_MAC"
          if [[ "$NEW_MAC" == "$OLD_MAC" ]]; then
            echo "MAC was not Spoofed!"
            exit 1
          else
            echo "MAC Spoofed successfully!"
          fi

  test-python-versions:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install .

      - name: Create dummy interface (wlan0)
        run: |
          sudo ip link add wlan0 type dummy
          sudo ip link set wlan0 up

      - name: Spoof MAC and verify it changed
        run: |
          OLD_MAC=$(ip link show wlan0 | awk '/ether/ {print $2}')
          sudo "$(command -v macspoofer)" -i wlan0 --ci
          NEW_MAC=$(ip link show wlan0 | awk '/ether/ {print $2}')
          echo "Old MAC: $OLD_MAC"
          echo "New MAC: $NEW_MAC"
          if [[ "$NEW_MAC" == "$OLD_MAC" ]]; then
            echo "MAC was not Spoofed!"
            exit 1
          fi

  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    needs: [lint, test, test-python-versions]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: macspoofer-wheel
          path: dist/*.whl
          if-no-files-found: error
